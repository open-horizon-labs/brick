format_version = 1
schema = '''
syntax = "proto3";
package brick.interface_check.v1;

// Checks a proposed standalone unary-service schema. No external references.
service InterfaceCheck {
  rpc Check(CheckRequest) returns (CheckResponse);
}
message CheckRequest { string schema = 1; }
message CheckResponse {
  bool valid = 1;
  // Empty when valid. Stable codes: IMPORTS_FORBIDDEN, INVALID_SCHEMA.
  string reason = 2;
}
'''

[[cases]]
name = "standalone schema is accepted"
method = "Check"
request_json = '{"schema":"syntax = \"proto3\"; package example.v1; service Example { rpc Get(Input) returns (Output); } message Input {} message Output {}"}'
response_json = '{"valid":true}'

[[cases]]
name = "well-known-type import is rejected"
method = "Check"
request_json = '{"schema":"syntax = \"proto3\"; import \"google/protobuf/timestamp.proto\"; package example.v1; service Example { rpc Get(Input) returns (Output); } message Input {} message Output {}"}'
response_json = '{"valid":false,"reason":"IMPORTS_FORBIDDEN"}'

[[cases]]
name = "invalid schema is rejected"
method = "Check"
request_json = '{"schema":"this is not protobuf"}'
response_json = '{"valid":false,"reason":"INVALID_SCHEMA"}'
