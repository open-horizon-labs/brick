[workspace]
members = ["crates/brick-contract", "crates/brick-runtime", "crates/brick-cli", "crates/brick-compiler", "crates/brick-generator", "crates/brick-seed", "crates/brick-rpc", "crates/brick-build", "contracts/compiler"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
anyhow = "=1.0.104"
axum = "=0.8.9"
bytes = "=1.11.1"
clap = { version = "=4.6.1", features = ["derive"] }
prost = "=0.14.3"
prost-build = "=0.14.3"
prost-types = "=0.14.3"
prost-reflect = { version = "=0.16.5", features = ["serde"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
tokio = { version = "=1.52.3", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-stream = { version = "=0.1.18", features = ["net"] }
toml = "=0.9.12"
tonic = "=0.14.5"
tonic-prost = "=0.14.5"
tonic-prost-build = "=0.14.5"
heck = "=0.5.0"
tower = { version = "=0.5.3", features = ["util"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
